<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>وكيلي</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi2YjZg9mK2YTZiiIsInNob3J0X25hbWUiOiLZiNmD2YrZhNmKIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwRjEyMTYiLCJ0aGVtZV9jb2xvciI6IiMwRjEyMTYifQ==">
<style>
  :root{
    --bg:#0F1216;
    --surface:#171B21;
    --surface-2:#1E232B;
    --border:#2A303A;
    --gold:#C99A4A;
    --gold-dim:#8A6F3F;
    --text:#E9E7E2;
    --text-dim:#8B93A1;
    --text-faint:#5B6272;
    --danger:#C9634A;
    --safe:#4AA785;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,sans-serif;
  }
  #app{
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    max-width:480px; margin:0 auto; position:relative;
    background:var(--bg);
  }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .avatar{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(160deg, var(--gold), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#14161A; flex-shrink:0;
  }
  .topbar .info{flex:1; min-width:0;}
  .topbar .name{font-size:15.5px; font-weight:600; letter-spacing:.2px;}
  .topbar .status{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; margin-top:1px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--safe); flex-shrink:0;}
  .topbar .reset{
    background:none; border:none; color:var(--text-faint); font-size:12.5px;
    padding:6px 10px; cursor:pointer;
  }

  /* Messages */
  #messages{
    flex:1; overflow-y:auto; padding:18px 16px 8px;
    display:flex; flex-direction:column; gap:12px;
    -webkit-overflow-scrolling:touch;
  }
  .msg{max-width:82%; padding:11px 14px; border-radius:16px; font-size:14.8px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word;}
  .msg.user{align-self:flex-start; background:var(--gold); color:#181206; border-bottom-left-radius:5px; font-weight:500;}
  .msg.agent{align-self:flex-end; background:var(--surface-2); color:var(--text); border-bottom-right-radius:5px; border:1px solid var(--border);}
  .msg.agent.confirm{border-color:var(--danger); background:#241A17;}
  .confirm-tag{display:block; font-size:11.5px; color:var(--danger); font-weight:700; margin-bottom:6px; letter-spacing:.3px;}
  .msg.system{
    align-self:center; background:none; color:var(--text-faint); font-size:12px;
    max-width:90%; text-align:center; padding:4px 10px;
  }
  .typing{align-self:flex-end; display:flex; gap:4px; padding:13px 16px; background:var(--surface-2); border-radius:16px; border-bottom-right-radius:5px; border:1px solid var(--border);}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-2px);}}

  /* Input bar */
  .inputbar{
    display:flex; align-items:flex-end; gap:8px;
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
    background:var(--surface); border-top:1px solid var(--border); flex-shrink:0;
  }
  #textInput{
    flex:1; resize:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); border-radius:20px; padding:11px 16px; font-size:14.8px;
    max-height:110px; font-family:inherit; outline:none; line-height:1.4;
  }
  #textInput:focus{border-color:var(--gold-dim);}
  #sendBtn{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--gold);
    color:#14161A; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:opacity .15s;
  }
  #sendBtn:disabled{opacity:.4;}
  #sendBtn svg{width:18px; height:18px;}

  /* Welcome */
  .welcome{padding:20px 6px 6px; text-align:center;}
  .welcome h1{font-size:19px; margin:0 0 6px; font-weight:700;}
  .welcome p{font-size:13.5px; color:var(--text-dim); margin:0; line-height:1.6;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .chip{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    font-size:12.5px; padding:8px 13px; border-radius:14px; cursor:pointer;
  }
  .chip:active{background:var(--border);}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="avatar">و</div>
    <div class="info">
      <div class="name">وكيلي</div>
      <div class="status"><span class="dot"></span><span id="statusText">جاهز للعمل</span></div>
    </div>
    <button class="reset" id="resetBtn">محادثة جديدة</button>
  </div>

  <div id="reportCard" style="display:none; margin:12px 14px 0; padding:13px 15px; background:var(--surface-2); border:1px solid var(--gold-dim); border-radius:14px; font-size:13px; line-height:1.6;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <strong style="color:var(--gold); font-size:12.5px;">📋 تقرير اليوم</strong>
      <button id="refreshReport" style="background:none; border:none; color:var(--text-faint); font-size:11.5px; cursor:pointer;">تحديث</button>
    </div>
    <div id="reportText" style="color:var(--text); white-space:pre-wrap;"></div>
  </div>

  <div id="messages"></div>

  <div class="inputbar">
    <textarea id="textInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
    <button id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 12h13M13 6l6 6-6 6"/>
      </svg>
    </button>
  </div>

</div>

<script>
const SYSTEM_PROMPT = `أنت "وكيلي" — مساعد أعمال ذكي ومستقل، تعمل نيابة عن صاحبك لمساعدته يحقق دخل ويبني مشاريع تجارية، بما فيها متجر إلكتروني (مثل أمازون) وأي مجال آخر يطلبه.

من أنت وكيف تتصرف:
- أنت عملي، مباشر، وواثق من نفسك. تعطي إجابات مفيدة فوراً بدون حشو أو مقدمات طويلة.
- تفكر كخبير أعمال حقيقي: تسأل نفسك "هل هذا قرار رابح؟" قبل ما تقترح أي شيء.
- ردودك منظمة ومختصرة، مناسبة لشاشة موبايل صغيرة (نقاط، فقرات قصيرة).
- تتحدث بالعربية دائماً، إلا إذا طلب المستخدم غير ذلك.

نطاق عملك (تتصرف فيه بحرية كاملة، بدون رجوع للمستخدم):
- البحث عن فرص تجارية ومنتجات رابحة
- تحليل المنافسين والأسواق والاتجاهات
- كتابة محتوى تسويقي (أوصاف منتجات، إعلانات، منشورات)
- الرد على استفسارات وأسئلة العملاء الافتراضية
- التخطيط الاستراتيجي وتقديم توصيات
- استخدام أداة البحث بالإنترنت كل ما احتجت معلومة حالية (أسعار، منتجات، أخبار سوق) — لا تعتمد على معرفتك القديمة وحدها لأي سؤال عن حالة السوق الآن

الخط الأحمر (توقف دائماً وتطلب تأكيد المستخدم):
أي إجراء فيه سحب مالي فعلي، دفع، شراء، أو التزام مالي جديد من أي نوع — لا تنفذه أبداً ولا تتظاهر بأنك نفذته. في هذه الحالة ابدأ ردك بالسطر التالي بالضبط: [CONFIRM_NEEDED]

حدود واقعية يجب أن توضحها بصدق إذا سُئلت:
- ما عندك اتصال فعلي حالياً بأي حساب متجر (أمازون أو غيره) — أنت تخطط وتحلل وتكتب، لكن التنفيذ الفعلي على المنصات يحتاج ربط تقني إضافي لم يُبنَ بعد.
- ما "تتطور" أو "تتعلم" بين المحادثات — كل محادثة جديدة تبدأ بنفس القدرات، بدون ذاكرة لما سبق.
لا تخجل من ذكر هذه الحدود بوضوح ولطف إذا سأل المستخدم، بدل ما تدّعي قدرات ما عندك.`;

let history = [];
const STORAGE_KEY = 'wakeely_chat_history';

function loadHistory(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      history = JSON.parse(saved);
      return true;
    }
  }catch(e){}
  return false;
}

function saveHistory(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }catch(e){}
}

function renderHistory(){
  messagesEl.innerHTML = '';
  history.forEach(msg => {
    let text = msg.content;
    let isConfirm = false;
    if(msg.role === 'assistant' && typeof text === 'string' && text.startsWith('[CONFIRM_NEEDED]')){
      text = text.replace('[CONFIRM_NEEDED]', '').trim();
      isConfirm = true;
    }
    if(typeof text === 'string'){
      addMessage(msg.role === 'user' ? 'user' : 'agent', text, isConfirm);
    }
  });
}
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const statusText = document.getElementById('statusText');
const resetBtn = document.getElementById('resetBtn');

function showWelcome(){
  messagesEl.innerHTML = `
    <div class="welcome">
      <h1>مرحباً 👋</h1>
      <p>أنا وكيلك. أتصرف بحرية في التخطيط والتحليل والمحتوى،<br>وأتوقف لأخذ إذنك في أي شيء فيه سحب مالي.</p>
      <div class="chips">
        <div class="chip" data-q="ابحث لي عن فكرة منتج رابحة لمتجر أمازون">فكرة منتج رابحة</div>
        <div class="chip" data-q="اكتب لي وصف منتج جذاب">اكتب وصف منتج</div>
        <div class="chip" data-q="كيف أبدأ بحساب بائع أمازون؟">التسجيل في أمازون</div>
      </div>
    </div>`;
  messagesEl.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{ inputEl.value = c.dataset.q; sendMessage(); });
  });
}
if(loadHistory() && history.length > 0){
  renderHistory();
} else {
  showWelcome();
}

function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
}
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

function scrollBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMessage(role, text, isConfirm=false){
  const welcome = messagesEl.querySelector('.welcome');
  if(welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isConfirm ? ' confirm' : '');
  if(isConfirm){
    div.innerHTML = '<span class="confirm-tag">⚠ يحتاج تأكيدك — عملية مالية</span>' + escapeHtml(text);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  scrollBottom();
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  autoGrow();
  addMessage('user', text);
  history.push({role:'user', content: text});

  sendBtn.disabled = true;
  statusText.textContent = 'يكتب...';
  showTyping();

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await response.json();
    hideTyping();

    let reply = (data.content || []).map(b => b.text || '').join('\n').trim();
    if(!reply) reply = 'عذراً، ما قدرت أفهم الطلب. جرب تصيغه بطريقة ثانية.';

    const isConfirm = reply.startsWith('[CONFIRM_NEEDED]');
    if(isConfirm) reply = reply.replace('[CONFIRM_NEEDED]', '').trim();

    addMessage('agent', reply, isConfirm);
    history.push({role:'assistant', content: reply});
    saveHistory();
  }catch(err){
    hideTyping();
    addMessage('agent', 'صار خطأ في الاتصال. تأكد من الاتصال بالإنترنت وحاول مرة ثانية.');
  }finally{
    sendBtn.disabled = false;
    statusText.textContent = 'جاهز للعمل';
  }
}

async function loadReport(){
  try{
    const res = await fetch('/api/get-report');
    const data = await res.json();
    if(data.ok && data.report && data.report.text){
      document.getElementById('reportText').textContent = data.report.text;
      document.getElementById('reportCard').style.display = 'block';
    }
  }catch(e){}
}
loadReport();
document.getElementById('refreshReport').addEventListener('click', async ()=>{
  document.getElementById('refreshReport').textContent = 'يحمّل...';
  await fetch('/api/daily-report');
  await loadReport();
  document.getElementById('refreshReport').textContent = 'تحديث';
});

sendBtn.addEventListener('click', sendMessage);
resetBtn.addEventListener('click', ()=>{
  history = [];
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  showWelcome();
});
</script>
</body>
</html>
